name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ProCam.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug
        working-directory: ProCam
      - uses: actions/upload-artifact@v4
        with:
          name: ProCam-APK
          path: ProCam/app/build/outputs/apk/debug/*.apk
